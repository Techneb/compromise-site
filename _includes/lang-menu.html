{%- comment -%} The globe menu: include.current is this page's code, include.label the word "Language" in its language. A <details> works as plain links without JS. {%- endcomment -%}
<details class="globe">
  <summary aria-label="{{ include.label }}: {% for l in site.data.languages %}{% if l.code == include.current %}{{ l.name }}{% endif %}{% endfor %}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="2.8" ry="6.5"/><path d="M1.5 8h13M2.6 4.8h10.8M2.6 11.2h10.8"/></svg>{{ include.current | upcase }}</summary>
  <ul>
  {%- for l in site.data.languages %}
    <li><a href="{{ l.path }}" lang="{{ l.code }}" hreflang="{{ l.code }}" data-lang="{{ l.code }}"{% if l.code == include.current %} aria-current="page"{% endif %}>{{ l.name }}</a></li>
  {%- endfor %}
  </ul>
</details>
<script>
// A picked language (here or in the footer) is remembered for /; Escape and a click outside close the menu.
(function () {
  var menu = document.currentScript.previousElementSibling;
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-lang]");
    if (a) try { localStorage.setItem("lang", a.getAttribute("data-lang")); } catch (_) {}
    if (menu.open && !menu.contains(e.target)) menu.open = false;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && menu.open) { menu.open = false; menu.querySelector("summary").focus(); }
  });
})();
</script>
