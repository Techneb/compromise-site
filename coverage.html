---
layout: null
---
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Compromise coverage</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#fbfcfc;--fg:#1d2a2d;--muted:#5b6b6f;--line:#dde3e4;--pass:#1f9d55;--gate:#7f8c90;--accent:#368B9C;--panel:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--fg:#e6ecec;--muted:#9aa8ab;--line:#2b3336;--accent:#16B9DB;--panel:#1c2224;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,system-ui,sans-serif;display:flex}
#map{flex:1;height:100%;min-width:0}
aside{width:340px;height:100%;overflow:auto;border-left:1px solid var(--line);padding:16px;background:var(--panel)}
h1{font-size:18px;margin:0 0 6px}p{margin:0 0 10px;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{text-align:left;padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}
td:not(:first-child),th:not(:first-child){text-align:right;white-space:nowrap}
tr.c{cursor:pointer}tr.c:hover td{color:var(--accent)}
small{color:var(--muted)}
@media (max-width:700px){body{flex-direction:column}#map{flex:none;height:58vh}aside{width:100%;height:auto;border:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="map"></div>
<aside>
<h1>Compromise coverage</h1>
<p id="status">Loading coverage…</p>
<p><span class="sw" style="background:var(--pass)"></span>sunny-terrace filter available<br>
<span class="sw" style="background:var(--gate)"></span>covered, filter not available yet</p>
<p>Tap an area to fly to it. Zoom in to see the 200 m blocks.</p>
<table><thead><tr><th>Area</th><th>km²</th><th>Blocks</th><th>Built</th></tr></thead><tbody id="list"></tbody></table>
</aside>
<script>
const FEED='https://pub-c7dde6811086418585889c3e30cf9880.r2.dev/coverage.json';
const css=getComputedStyle(document.documentElement), v=n=>css.getPropertyValue(n).trim();
const map=L.map('map',{preferCanvas:true,worldCopyJump:true}).setView([48.86,2.35],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const edge=k=>[k/500,(k+(k<0?-1:1))/500];
const status=document.getElementById('status'), list=document.getElementById('list');
fetch(FEED,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
  const pass=v('--pass'), gate=v('--gate'), cells=L.layerGroup().addTo(map);
  for(const c of d.cells){const a=edge(c[0]),b=edge(c[1]),ok=c[3]>=20;
    L.rectangle([[Math.min(a[0],a[1]),Math.min(b[0],b[1])],[Math.max(a[0],a[1]),Math.max(b[0],b[1])]],
      {stroke:false,fillColor:ok?pass:gate,fillOpacity:ok?.5:.35,interactive:false}).addTo(cells);}
  const areas=(d.areas||[]).slice().sort((x,y)=>(y.km2||0)-(x.km2||0));
  for(const a of areas){
    const [s,w,n,e]=a.box;
    L.circleMarker([(s+n)/2,(w+e)/2],{radius:Math.max(4,Math.sqrt(a.km2||0)*2.2),color:v('--accent'),weight:1.5,fillColor:v('--accent'),fillOpacity:.45})
      .addTo(map).bindTooltip(a.city+(a.name&&a.name!==a.city?' · '+a.name:''),{direction:'top'})
      .on('click',()=>map.fitBounds([[s,w],[n,e]]));
    const tr=document.createElement('tr');tr.className='c';
    const cellsTxt=(a.passing||0).toLocaleString()+'/'+(a.tiled||0).toLocaleString();
    tr.innerHTML='<td>'+a.city+(a.name&&a.name!==a.city?'<br><small>'+a.name+'</small>':'')+'</td><td>'+(a.km2!=null?Number(a.km2).toFixed(1):'')+'</td><td>'+cellsTxt+'</td><td>'+(a.lastBuilt||'')+'</td>';
    tr.onclick=()=>map.fitBounds([[s,w],[n,e]]);list.appendChild(tr);}
  status.textContent='Updated '+(d.updated||'')+'. '+d.cells.length.toLocaleString()+' blocks in '+areas.length+' areas.';
}).catch(err=>{status.textContent='The coverage feed did not answer ('+err.message+'); try again later.';});
</script></body></html>
