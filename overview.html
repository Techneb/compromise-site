<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Compromise overview</title>
<style>
:root{--bg:#fbfcfc;--fg:#1d2a2d;--muted:#5b6b6f;--line:#dde3e4;--accent:#368B9C;--panel:#fff;--ok:#1f9d55;--part:#e0a030;--bad:#c94a3c}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--fg:#e6ecec;--muted:#9aa8ab;--line:#2b3336;--accent:#16B9DB;--panel:#1c2224;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:1400px;margin:0 auto;padding:16px}
nav{display:flex;gap:14px;align-items:center;margin-bottom:10px}nav a{color:var(--muted);text-decoration:none;font-weight:600}nav a.on{color:var(--accent);border-bottom:2px solid var(--accent)}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:0;display:inline}
details{margin-top:22px}summary{cursor:pointer;margin-bottom:4px}summary:hover h2{color:var(--accent)}p{margin:0 0 8px;color:var(--muted)}
.big{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0}.big div{display:flex;flex-direction:column}.big b{font-size:22px;font-variant-numeric:tabular-nums}.big span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{text-align:left;padding:6px 6px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500;vertical-align:bottom;user-select:none;background:var(--bg)}
th[data-k]{cursor:pointer}th.on{color:var(--accent)}th.on::after{content:' ▾'}th.on.asc::after{content:' ▴'}
td.n,th.n{text-align:right}td.n{white-space:nowrap}
tr.c{cursor:pointer}tr.c:hover td{color:var(--accent)}tr.c td:first-child::before{content:'▸ ';color:var(--muted)}tr.c.open td:first-child::before{content:'▾ '}
tr.sub>td{padding:0 0 10px 18px;border-top:0}tr.sub table{font-size:12px}
.tag{display:inline-block;white-space:nowrap;padding:1px 6px;border-radius:10px;font-size:12px;background:var(--line)}.tag.ok{background:var(--ok);color:#fff}.tag.part{background:var(--part);color:#fff}.tag.bad{background:var(--bad);color:#fff}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}.meter i{display:block;height:100%;background:var(--accent)}
.meter.total{height:12px;margin:6px 0 10px;max-width:640px}
a{color:var(--accent)}small{color:var(--muted)}
@media (max-width:700px){.hide{display:none}.scroll{overflow-x:auto}.big{gap:18px}}
</style><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body><main>
<nav><a href="coverage.html">Map</a><a href="cities.html">Cities</a><a class="on" href="overview.html">Overview</a></nav>
<h1>Overview</h1>
<p id="status">Loading…</p>

<details id="sec-totals" open><summary><h2>Totals</h2></summary>
<div class="big" id="totals"></div>
<p id="tally"></p>
</details>

<details id="sec-storage"><summary><h2>Storage</h2></summary>
<div id="storage"><p>Loading…</p></div>
</details>

<details id="sec-countries" open><summary><h2>Countries</h2></summary>
<p><small>* counted in a 24 km square around the city's centre.</small></p>
<div class="scroll"><table><thead><tr>
<th data-k="country">Country</th><th data-k="covered" class="n">Cities covered</th><th data-k="all" class="n">Cities in the database</th><th>Top 3 by going-out blocks</th><th data-k="population" class="n">Population covered</th><th data-k="streets" class="n">Cities with streets</th>
</tr></thead><tbody id="countries"></tbody></table></div>
</details>
</main>
<script>
const TILES='https://tiles.alephb.uk/', STATUS='https://raw.githubusercontent.com/Techneb/compromise-tiles/master/cities-status.json';
const get=u=>fetch(u+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
const $=id=>document.getElementById(id), fmt=n=>n==null?'':Number(n).toLocaleString(), pct=x=>x==null?'':(x<0.1?(100*x).toFixed(1):Math.round(100*x))+' %';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const size=b=>b==null?'':b>=1e9?(b/1e9).toFixed(2)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':(b/1e3).toFixed(0)+' kB';
const day=t=>t?new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
// A sortable table: headers with data-k sort, a second click flips; text columns start ascending.
const sortable=(tbody,state,draw)=>tbody.closest('table').querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;
  if(state.key===k)state.asc=!state.asc;else{state.key=k;state.asc=(k==='city'||k==='country');}draw();});
const sortRows=(rows,{key,asc})=>rows.sort((x,y)=>{const v=r=>typeof r[key]==='string'?r[key].toLowerCase():(r[key]==null?-1:r[key]);const p=v(x),q=v(y);return (p<q?-1:p>q?1:0)*(asc?1:-1);});
const marks=(tbody,{key,asc})=>tbody.closest('table').querySelectorAll('th[data-k]').forEach(th=>{th.classList.toggle('on',th.dataset.k===key);th.classList.toggle('asc',th.dataset.k===key&&asc);});

const status=get(STATUS), coverage=get(TILES+'coverage.json').catch(()=>({areas:[]})), counts=get(TILES+'counts.json').catch(()=>({cities:[]}));
const cities=get(TILES+'cities.json').catch(()=>[]), stats=get(TILES+'stats.json').catch(()=>null);

// Each section opens or closes as this viewer last left it.
document.querySelectorAll('details[id]').forEach(d=>{const k='ov:open:'+d.id;
  try{const v=localStorage.getItem(k);if(v!==null)d.open=v==='1';}catch(e){}
  d.addEventListener('toggle',()=>{try{localStorage.setItem(k,d.open?'1':'0');}catch(e){}});});

// ---- the cities: cities.html's joins (a name and a place: an area's box holds the city's point give or take 12 km)
Promise.all([status,coverage,counts,cities]).then(([s,feed,cnts,tiled])=>{
  const KM=12, near=(la,lo,lb,lob)=>Math.hypot((la-lb)*111.32,(lo-lob)*111.32*Math.cos(la*Math.PI/180))<=KM;
  const holds=(box,c)=>{if(c.lat==null)return true;const [s0,w,n,e]=box,dy=KM/111.32,dx=dy/Math.cos(c.lat*Math.PI/180);
    return c.lat>=s0-dy&&c.lat<=n+dy&&c.lon>=w-dx&&c.lon<=e+dx;};
  const cnt={}; for(const c of cnts.cities||[]) (cnt[c.city]=cnt[c.city]||[]).push(c);
  const countsRow=c=>(cnt[c.city]||[]).find(k=>(!k.country||k.country===c.country)&&(k.lat==null||c.lat==null||near(k.lat,k.lon,c.lat,c.lon)));
  const streetNames=new Set((Array.isArray(tiled)?tiled:[]).filter(e=>e.streets===true).map(e=>e.city));
  // Past the name, the numbers: a core whose areas cover 85 % of the city's surface, or a tiled box holding 95 % of its
  // square's going-out blocks, is the whole city.
  const wholeByNumbers=(c,km2,k)=>(!!c.cityAreaKm2&&km2/c.cityAreaKm2>=0.85)
    ||(!!k&&k.extent==='tiled box'&&k.goingOutCellsWide>0&&k.goingOutCoveredWide!=null&&k.goingOutCoveredWide/k.goingOutCellsWide>=0.95);
  const rows=s.cities.map(c=>{const cand=c.status==='candidate';
    const areas=cand?[]:(feed.areas||[]).filter(a=>a.city===c.city&&a.box&&holds(a.box,c));
    let rank=0; for(const a of areas){const whole=/whole|intra-muros|municipality|^greater /i.test(a.name)||a.name===a.city;rank=Math.max(rank,whole?2:1);}
    const k=cand?null:countsRow(c);
    if(rank===1&&wholeByNumbers(c,areas.reduce((t,a)=>t+(a.km2||0),0),k))rank=2;
    const g=!k?{goingOut:c.goingOut,sq:!!c.extent&&!/^(municipality|commune)$/.test(c.extent)}
      :k.extent==='tiled box'?{goingOut:k.goingOutCellsWide,sq:true}:{goingOut:k.goingOutCells,sq:!/^(municipality|commune)$/.test(k.extent)};
    return Object.assign({},c,g,{rank,streets:streetNames.has(c.city)});});
  const covered=rows.filter(r=>r.rank);

  // ---- 1. totals, and the status breakdown in cities.html's words
  const countries=new Set(covered.map(r=>r.country));
  $('totals').innerHTML=[[covered.length,'cities covered'],[countries.size,'countries covered'],[covered.filter(r=>r.rank===2).length,'whole city'],[covered.filter(r=>r.rank===1).length,'core only'],
    [rows.length,'cities in the database'],[streetNames.size,'cities with streets']].map(([n,t])=>'<div><b>'+fmt(n)+'</b><span>'+t+'</span></div>').join('');
  const tally=s.reasons||rows.reduce((t,r)=>(t[r.reason]=(t[r.reason]||0)+1,t),{});
  $('tally').innerHTML=Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([k,n])=>n+' '+esc(k.toLowerCase())).join(' · ');

  // ---- 2. countries, a row opens on its cities
  const byCountry={}; for(const r of rows)(byCountry[r.country]=byCountry[r.country]||[]).push(r);
  const ctry=Object.entries(byCountry).map(([country,list])=>{const cov=list.filter(r=>r.rank);
    return {country,list,covered:cov.length,all:list.length,population:cov.reduce((t,r)=>t+(r.population||0),0),streets:list.filter(r=>r.streets).length,
      top:cov.slice().sort((a,b)=>(b.goingOut||0)-(a.goingOut||0)).slice(0,3)};});
  const cState={key:'covered',asc:false}, open=new Set();
  const outCell=r=>r.goingOut==null?'<small>not counted</small>':fmt(r.goingOut)+(r.sq?'<small>*</small>':'');
  const covTag=r=>'<span class="tag '+(r.rank===2?'ok':r.rank===1?'part':'')+'">'+(r.rank===2?'whole city':r.rank===1?'core':'none')+'</span>';
  const drawCountries=()=>{sortRows(ctry,cState);marks($('countries'),cState);
    $('countries').innerHTML=ctry.map(c=>'<tr class="c'+(open.has(c.country)?' open':'')+'" data-c="'+esc(c.country)+'"><td>'+esc(c.country)+'</td><td class="n">'+fmt(c.covered)+'</td><td class="n">'+fmt(c.all)+'</td><td>'
      +c.top.map(r=>esc(r.city)+' <small>'+fmt(r.goingOut)+'</small>').join(', ')+'</td><td class="n">'+(c.population?fmt(c.population):'')+'</td><td class="n">'+(c.streets||'')+'</td></tr>'
      +(open.has(c.country)?'<tr class="sub"><td colspan="6"><table><thead><tr><th>City</th><th>Coverage</th><th class="n">Going-out blocks</th><th class="n">Inhabitants</th><th class="hide">Waiting for</th><th>Streets</th></tr></thead><tbody>'
        +c.list.slice().sort((a,b)=>b.rank-a.rank||(b.goingOut||0)-(a.goingOut||0)).map(r=>'<tr><td>'+(r.rank?'<a href="coverage.html#'+encodeURIComponent(r.city)+'">'+esc(r.city)+'</a>':esc(r.city))+'</td><td>'+covTag(r)+'</td><td class="n">'+outCell(r)+'</td><td class="n">'+fmt(r.population)+'</td><td class="hide">'
          +(r.rank===2||r.reason==='Covered'?'':esc(r.reason))+'</td><td>'+(r.streets?'yes':'')+'</td></tr>').join('')+'</tbody></table></td></tr>':'')).join('');};
  $('countries').onclick=e=>{const tr=e.target.closest('tr.c');if(!tr||e.target.closest('a'))return;const k=tr.dataset.c;open.has(k)?open.delete(k):open.add(k);drawCountries();};
  sortable($('countries'),cState,drawCountries); drawCountries();

  const upd=[s.updated,feed.updated].filter(Boolean).sort().pop();
  $('status').textContent=upd?'Updated '+upd.slice(0,10)+'.':'';
}).catch(err=>{$('status').textContent='The data did not load ('+err.message+'). Try again later.';});

// ---- 3. storage per layer against R2's free 10 GB
stats.then(st=>{
  if(!st||!st.layers){$('storage').innerHTML='<p>No storage numbers yet: they arrive with the next tile build.</p>';return;}
  const free=st.freeBytes||1e10, list=Object.entries(st.layers).sort((a,b)=>b[1].bytes-a[1].bytes);
  if(st.other&&st.other.objects) list.push(['other files',st.other]);
  const bar=x=>'<div class="meter"><i style="width:'+Math.min(100,100*x).toFixed(1)+'%"></i></div>';
  $('storage').innerHTML='<p><b style="color:var(--fg)">'+size(st.bytes)+'</b> of '+size(free)+' free ('+pct(st.bytes/free)+'), '+fmt(st.objects)+' files. Listed '+day(st.updated)+'.</p>'
    +'<div class="meter total"><i style="width:'+Math.min(100,100*st.bytes/free).toFixed(1)+'%"></i></div>'
    +'<div class="scroll"><table><thead><tr><th>Layer</th><th class="n">Size</th><th class="n">Files</th><th class="n">Of 10 GB</th><th style="width:40%"></th></tr></thead><tbody>'
    +list.map(([l,v])=>'<tr><td>'+esc(l)+'</td><td class="n">'+size(v.bytes)+'</td><td class="n">'+fmt(v.objects)+'</td><td class="n">'+pct(v.bytes/free)+'</td><td>'+bar(v.bytes/free)+'</td></tr>').join('')+'</tbody></table></div>';
});

</script></body></html>
