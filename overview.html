<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Compromise overview</title>
<style>
:root{--bg:#fbfcfc;--fg:#1d2a2d;--muted:#5b6b6f;--line:#dde3e4;--accent:#368B9C;--panel:#fff;--ok:#157a42;--part:#e0a030}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--fg:#e6ecec;--muted:#9aa8ab;--line:#2b3336;--accent:#16B9DB;--panel:#1c2224;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:1400px;margin:0 auto;padding:16px}
nav{display:flex;gap:14px;align-items:center;margin-bottom:10px}nav a{color:var(--muted);text-decoration:none;font-weight:600}nav a.on{color:var(--accent);border-bottom:2px solid var(--accent)}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:0;display:inline}
details{margin-top:22px}details details{margin-top:4px}summary{cursor:pointer;margin-bottom:4px}summary:hover h2{color:var(--accent)}p{margin:0 0 8px;color:var(--muted)}
.big{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0}.big div{display:flex;flex-direction:column}.big b{font-size:22px;font-variant-numeric:tabular-nums}.big span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{text-align:left;padding:6px 6px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500;vertical-align:bottom;user-select:none;background:var(--bg)}
th[data-k]{cursor:pointer}
.btn{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}.btn:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.short{display:none}ul.why{margin:4px 0 8px;padding-left:20px;color:var(--muted)}ul.why li{margin-bottom:6px}.ex{color:var(--fg);font-size:13px;overflow-wrap:anywhere}.ex small{white-space:nowrap}.ex .btn{color:var(--accent)}tr.more td{padding-top:10px}th.on{color:var(--accent)}th.on::after{content:' ▾'}th.on.asc::after{content:' ▴'}
td.n,th.n{text-align:right}td.n{white-space:nowrap}
tr.c{cursor:pointer}tr.c:hover td{color:var(--accent)}tr.c .btn::before{content:'▸ ';color:var(--muted)}tr.c.open .btn::before{content:'▾ '}
tr.sub>td{padding:0 0 10px 18px;border-top:0}tr.sub table{font-size:12px}
.tag{display:inline-block;white-space:nowrap;padding:1px 6px;border-radius:10px;font-size:12px;background:var(--line)}.tag.ok{background:var(--ok);color:#fff}.tag.part{background:var(--part);color:#1d2a2d}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}.meter i{display:block;height:100%;background:var(--accent)}
.tip{position:relative;cursor:help;outline:none}.tip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tip em{display:none;position:absolute;top:100%;left:0;z-index:2;margin-top:4px;padding:4px 8px;border-radius:6px;background:var(--fg);color:var(--bg);font-style:normal;font-size:12px;white-space:nowrap}
.tip:hover em,.tip:focus em{display:block}
.grp{display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--line);padding-top:4px}.grp h3{flex:none;width:4.5em;margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.grp .big{margin:4px 0 10px;row-gap:8px}.big b small{font-size:13px;font-weight:400;margin-left:4px}
.meter.total{height:12px;margin:6px 0 10px;max-width:640px}
a{color:var(--accent)}small{color:var(--muted)}
@media (max-width:700px){.grp{display:block}.grp .big{margin-top:2px}.tip em{position:static;white-space:normal;max-width:60vw}.hide,.long{display:none}.short{display:inline}.scroll{overflow-x:auto}.big{gap:18px}th,td{padding:6px 4px}th[data-k]{white-space:nowrap}tr.sub>td{padding-left:8px}tr.sub td td,tr.sub th{padding:5px 3px}}
</style><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body><main>
<nav><a href="coverage.html">Map</a><a href="cities.html">Cities</a><a class="on" aria-current="page" href="overview.html">Overview</a></nav>
<h1>Overview</h1>
<p id="status">Loading…</p>

<details id="sec-totals" open><summary><h2>Totals</h2></summary>
<div id="totals"></div>
<details id="sec-why"><summary>Why not covered</summary><ul class="why" id="tally"></ul></details>
</details>

<details id="sec-storage" open><summary><h2>Storage</h2></summary>
<div id="storage"><p>Loading…</p></div>
</details>

<details id="sec-countries" open><summary><h2>Countries</h2></summary>
<p><small>* counted in a 24 km square around the city's centre.</small></p>
<div class="scroll"><table><thead><tr>
<th data-k="country"><button type="button" class="btn">Country</button></th><th data-k="covered" class="n"><button type="button" class="btn"><span class="long">Cities covered</span><span class="short">Covered</span></button></th><th data-k="all" class="n"><button type="button" class="btn"><span class="long">Cities in the database</span><span class="short">Listed</span></button></th><th class="hide">Top 3 by going-out blocks</th><th data-k="population" class="n"><button type="button" class="btn"><span class="long">Population covered</span><span class="short">Population</span></button></th><th data-k="streets" class="n"><button type="button" class="btn"><span class="long">Cities with streets</span><span class="short">Streets</span></button></th><th data-k="transit" class="n"><button type="button" class="btn"><span class="long">Cities with transit lines</span><span class="short">Transit</span></button></th>
</tr></thead><tbody id="countries"></tbody></table></div>
</details>
</main>
<script src="/common.js"></script>
<script>
const TILES='https://tiles.alephb.uk/', STATUS='https://raw.githubusercontent.com/Techneb/compromise-tiles/master/cities-status.json';
// Sizes to 3 significant figures: 4.35 GB, 78.0 MB, 169 kB.
const size=b=>{if(b==null)return '';if(b<1000)return fmt(b)+' B';let i=Math.min(4,Math.floor(Math.log10(b)/3)),v=b/Math.pow(1000,i);
  if(v>=999.5&&i<4){i++;v/=1000;}return v.toLocaleString(undefined,{minimumSignificantDigits:3,maximumSignificantDigits:3})+' '+['B','kB','MB','GB','TB'][i];};
const day=t=>t?new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
// A sortable table: headers with data-k sort, a second click flips; text columns start ascending.
const sortable=(tbody,state,draw)=>tbody.closest('table').querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;
  if(state.key===k)state.asc=!state.asc;else{state.key=k;state.asc=(k==='city'||k==='country');}draw();});
const sortRows=(rows,{key,asc})=>rows.sort((x,y)=>{const v=r=>typeof r[key]==='string'?r[key].toLowerCase():(r[key]==null?-1:r[key]);const p=v(x),q=v(y);return (p<q?-1:p>q?1:0)*(asc?1:-1);});
const marks=(tbody,{key,asc})=>tbody.closest('table').querySelectorAll('th[data-k]').forEach(th=>{const on=th.dataset.k===key;th.classList.toggle('on',on);th.classList.toggle('asc',on&&asc);
  on?th.setAttribute('aria-sort',asc?'ascending':'descending'):th.removeAttribute('aria-sort');});

const status=get(STATUS), coverage=get(TILES+'areas.json').catch(()=>get(TILES+'coverage.json')).catch(()=>({areas:[]})), counts=get(TILES+'counts.json').catch(()=>({cities:[]}));
const cities=get(TILES+'cities.json').catch(()=>[]), stats=get(TILES+'stats.json').catch(()=>null);

// Each section opens or closes as this viewer last left it.
document.querySelectorAll('details[id]').forEach(d=>{const k='ov:open:'+d.id;
  try{const v=localStorage.getItem(k);if(v!==null)d.open=v==='1';}catch(e){}
  d.addEventListener('toggle',()=>{try{localStorage.setItem(k,d.open?'1':'0');}catch(e){}});});

// ---- the cities: cities.html's joins (a name and a place: an area's box holds the city's point give or take 12 km)
Promise.all([status,coverage,counts,cities,stats]).then(([s,feed,cnts,tiled,st])=>{
  const countsRow=countsRows(cnts.cities);
  const streetNames=new Set((Array.isArray(tiled)?tiled:[]).filter(e=>e.streets===true).map(e=>e.city));
  const rows=s.cities.map(c=>{const cand=c.status==='candidate';
    const areas=cand?[]:(feed.areas||[]).filter(a=>a.city===c.city&&a.box&&holds(a.box,c));
    let rank=0; for(const a of areas){const whole=wholeName(a);rank=Math.max(rank,whole?2:1);}
    const k=cand?null:countsRow(c);
    if(rank===1&&wholeByNumbers(c,areas.reduce((t,a)=>t+(a.km2||0),0),k))rank=2;
    const g=!k?{goingOut:c.goingOut,sq:!!c.extent&&!/^(municipality|commune)$/.test(c.extent)}
      :k.extent==='tiled box'?{goingOut:k.goingOutCellsWide,sq:true}:{goingOut:k.goingOutCells,sq:!/^(municipality|commune)$/.test(k.extent)};
    const tl=rank&&feed.transit&&feed.transit[c.city];
    return Object.assign({},c,g,{rank,streets:streetNames.has(c.city),lines:tl?tl.lines:0});});
  const covered=rows.filter(r=>r.rank);

  // ---- 1. totals in three groups: depth first (growth stopped 2026-10-15, the page follows consolidation), then reach, then the tile store.
  // A KPI with a share shows it beside the number and spells it out on hover or focus.
  let tt=0;
  const kpi=(v,label,share,tip)=>{if(v==null||v==='')return '<div><b>–</b><span>'+label+'</span></div>';
    const b='<b>'+v+(share==null?'':'<small>'+pct(share)+'</small>')+'</b><span>'+label+'</span>';
    if(!tip)return '<div>'+b+'</div>';const id='tt-'+(++tt);
    return '<div class="tip" tabindex="0" title="'+esc(tip)+'" aria-describedby="'+id+'">'+b+'<em role="tooltip" id="'+id+'">'+esc(tip)+'</em></div>';};
  const of=(n,d,what)=>n==null||!d?{}:{share:n/d,tip:fmt(n)+' of '+fmt(d)+' '+what+', '+pct(n/d)};
  const ofCov=n=>of(n,covered.length,'covered cities');
  const part=(n,label,o)=>kpi(n==null?null:fmt(n),label,o.share,o.tip);
  const sum=k=>(feed.areas||[]).reduce((t,a)=>t+(a[k]||0),0);
  const countries=new Set(covered.map(r=>r.country)), whole=covered.filter(r=>r.rank===2).length;
  // Cities with transit lines: the feed's "transit" key, a dash until a feed carries it.
  const transit=feed.transit?Object.keys(feed.transit).filter(c=>feed.transit[c].lines>0).length:null;
  // The sunny filter in blocks, in coverage.html's words: it works where a block passes, and judges the terrace itself where a terrace is on record.
  const passing=sum('passing'), known=sum('terracesKnown');
  const builds=st&&st.builds?Object.entries(st.builds):[], last=builds.map(([,b])=>b.date).sort().pop(), failed=builds.filter(([,b])=>b.result!=='success');
  const free=st&&(st.freeBytes||1e10);
  const groups=[
    ['Depth',[part(whole,'whole city',ofCov(whole)),part(covered.length-whole,'core only',ofCov(covered.length-whole)),
      part(streetNames.size,'cities with streets',ofCov(streetNames.size)),part(transit,'cities with transit lines',ofCov(transit)),
      part(passing,'blocks where the sunny filter works',of(passing,sum('tiled'),'blocks with data')),
      part(known,'blocks with terrace records',of(known,passing,'blocks where the filter works'))]],
    ['Reach',[part(covered.length,'cities covered',of(covered.length,rows.length,'cities in the database')),part(countries.size,'countries covered',{}),
      part(covered.reduce((t,r)=>t+(r.population||0),0),'population covered',{})]],
    ['Tiles',[kpi(st&&st.bytes!=null?size(st.bytes):null,'stored',st&&st.bytes/free,st&&size(st.bytes)+' of '+size(free)+' free, '+pct(st.bytes/free)),
      kpi(last?day(last):null,'last tile build',null,last?fmt(builds.filter(([,b])=>b.date===last).length)+' cities built that day':''),
      part(builds.length?failed.length:null,'failed builds',failed.length?{tip:failed.map(([c])=>c).join(', ')}:{})]]];
  $('totals').innerHTML=groups.map(([h,list])=>'<div class="grp"><h3>'+h+'</h3><div class="big">'+list.join('')+'</div></div>').join('');
  const tally=s.reasons||rows.reduce((t,r)=>(t[r.reason]=(t[r.reason]||0)+1,t),{});
  // Each reason names its biggest cities (by inhabitants, then going-out blocks); a button shows the rest in place.
  const byReason={}; for(const r of rows)(byReason[r.reason]=byReason[r.reason]||[]).push(r);
  const big=(a,b)=>(b.population||0)-(a.population||0)||(b.goingOut||0)-(a.goingOut||0)||a.city.localeCompare(b.city);
  const place=r=>{const m=/^(.*) \((.*)\)$/.exec(r.city);return esc(m?m[1]:r.city)+' <small>('+esc([m&&m[2],r.country].filter(Boolean).join(', '))+')</small>';};
  $('tally').innerHTML=Object.entries(tally).filter(([k])=>k&&k.toLowerCase()!=='covered').sort((a,b)=>b[1]-a[1]).map(([k,n],i)=>{
    const list=(byReason[k]||[]).slice().sort(big), rest=list.length-5;
    return '<li>'+fmt(n)+' '+esc(k.toLowerCase())+(list.length?'<div class="ex">'+list.slice(0,5).map(place).join(', ')
      +(rest>0?'<span id="why-'+i+'" hidden>, '+list.slice(5).map(place).join(', ')+'</span> <button type="button" class="btn" aria-expanded="false" aria-controls="why-'+i+'" data-n="'+rest+'" title="'+esc(list.map(r=>r.city).join(', '))+'">+'+fmt(rest)+' more</button>':'')+'</div>':'')+'</li>';}).join('');
  $('tally').onclick=e=>{const b=e.target.closest('button[aria-controls]');if(!b)return;const o=b.getAttribute('aria-expanded')!=='true';
    b.setAttribute('aria-expanded',o);$(b.getAttribute('aria-controls')).hidden=!o;b.textContent=o?'show fewer':'+'+fmt(+b.dataset.n)+' more';};

  // ---- 2. countries, a row opens on its cities
  const byCountry={}; for(const r of rows)(byCountry[r.country]=byCountry[r.country]||[]).push(r);
  const ctry=Object.entries(byCountry).map(([country,list])=>{const cov=list.filter(r=>r.rank);
    return {country,list,covered:cov.length,all:list.length,population:cov.reduce((t,r)=>t+(r.population||0),0),streets:list.filter(r=>r.streets).length,transit:feed.transit?list.filter(r=>r.lines>0).length:null,
      top:cov.slice().sort((a,b)=>(b.goingOut||0)-(a.goingOut||0)).slice(0,3)};});
  const cState={key:'covered',asc:false}, open=new Set(); let more=false;
  const outCell=r=>r.goingOut==null?'<small>not counted</small>':fmt(r.goingOut)+(r.sq?'<small>*</small>':'');
  const covTag=r=>'<span class="tag '+(r.rank===2?'ok':r.rank===1?'part':'')+'">'+(r.rank===2?'whole city':r.rank===1?'core':'none')+'</span>';
  const row=c=>{const o=open.has(c.country);
    return '<tr class="c'+(o?' open':'')+'" data-c="'+esc(c.country)+'"><td><button type="button" class="btn" aria-expanded="'+o+'" data-f="c:'+esc(c.country)+'">'+esc(c.country)+'</button></td><td class="n">'+fmt(c.covered)+'</td><td class="n">'+fmt(c.all)+'</td><td class="hide">'
      +c.top.map(r=>esc(r.city)+' <small>'+fmt(r.goingOut)+'</small>').join(', ')+'</td><td class="n">'+(c.population?fmt(c.population):'')+'</td><td class="n">'+(c.streets?fmt(c.streets):'')+'</td><td class="n">'+(c.transit==null?'–':c.transit?fmt(c.transit):'')+'</td></tr>'
      +(o?'<tr class="sub"><td colspan="7"><table><thead><tr><th>City</th><th>Coverage</th><th class="n"><span class="long">Going-out blocks</span><span class="short">Going-out</span></th><th class="n"><span class="long">Inhabitants</span><span class="short">People</span></th><th class="hide">Waiting for</th><th>Streets</th><th class="n"><span class="long">Transit lines</span><span class="short">Transit</span></th></tr></thead><tbody>'
        +c.list.slice().sort((a,b)=>b.rank-a.rank||(b.goingOut||0)-(a.goingOut||0)).map(r=>'<tr><td>'+(r.rank?'<a href="coverage.html#'+encodeURIComponent(r.city)+'">'+esc(r.city)+'</a>':esc(r.city))+'</td><td>'+covTag(r)+'</td><td class="n">'+outCell(r)+'</td><td class="n">'+fmt(r.population)+'</td><td class="hide">'
          +(r.rank===2||r.reason==='Covered'?'':esc(r.reason))+'</td><td>'+(r.streets?'yes':'')+'</td><td class="n">'+(r.lines?fmt(r.lines):'')+'</td></tr>').join('')+'</tbody></table></td></tr>':'');};
  // Countries with a covered city first; the others wait behind a button.
  const drawCountries=()=>{sortRows(ctry,cState);marks($('countries'),cState);const zero=ctry.filter(c=>!c.covered);
    $('countries').innerHTML=ctry.filter(c=>c.covered).map(row).join('')
      +(zero.length?'<tr class="more"><td colspan="7"><button type="button" class="btn" aria-expanded="'+more+'" data-f="more">'+(more?'▾ ':'▸ ')+fmt(zero.length)+' more '+(zero.length===1?'country':'countries')+' with no city covered</button></td></tr>'
        +(more?zero.map(row).join(''):''):'');};
  // A click, Enter or Space opens a row; the redraw keeps the focus on the same button.
  $('countries').onclick=e=>{if(e.target.closest('a'))return;
    if(e.target.closest('tr.more'))more=!more;
    else{const tr=e.target.closest('tr.c');if(!tr)return;const k=tr.dataset.c;open.has(k)?open.delete(k):open.add(k);}
    const f=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.f;drawCountries();
    if(f){const btn=[...$('countries').querySelectorAll('[data-f]')].find(x=>x.dataset.f===f);if(btn)btn.focus();}};
  sortable($('countries'),cState,drawCountries); drawCountries();

  const upd=[s.updated,feed.updated].filter(Boolean).sort().pop();
  $('status').textContent=upd?'Updated '+upd.slice(0,10)+'.':'';
}).catch(err=>{$('status').textContent='The data did not load ('+err.message+'). Try again later.';});

// ---- 3. storage per layer
stats.then(st=>{
  if(!st||!st.layers){$('storage').innerHTML='<p>No storage numbers yet.</p>';return;}
  const free=st.freeBytes||1e10, list=Object.entries(st.layers).sort((a,b)=>b[1].bytes-a[1].bytes);
  if(st.other&&st.other.objects) list.push(['other files',st.other]);
  const bar=x=>'<div class="meter"><i style="width:'+Math.min(100,100*x).toFixed(1)+'%"></i></div>';
  $('storage').innerHTML='<p><b style="color:var(--fg)">'+size(st.bytes)+'</b> of '+size(free)+' ('+pct(st.bytes/free)+'), '+fmt(st.objects)+' files. Listed '+day(st.updated)+'.</p>'
    +'<div class="meter total"><i style="width:'+Math.min(100,100*st.bytes/free).toFixed(1)+'%"></i></div>'
    +'<div class="scroll"><table><thead><tr><th>Layer</th><th class="n">Size</th><th class="n">Files</th><th class="n">Of '+size(free)+'</th><th style="width:40%"></th></tr></thead><tbody>'
    +list.map(([l,v])=>'<tr><td>'+esc(l)+'</td><td class="n">'+size(v.bytes)+'</td><td class="n">'+fmt(v.objects)+'</td><td class="n">'+pct(v.bytes/free)+'</td><td>'+bar(v.bytes/free)+'</td></tr>').join('')+'</tbody></table></div>';
});

</script></body></html>
