<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compromise — Spots</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<style>
/* Same tokens, nav and footer as privacy.html. */
:root {
  --bg: #F6F9FA; --surface: #FFFFFF; --fg: #0F2328; --muted: #50686E; --hair: #DCE6E8;
  --tint: #2F7F90; --p1: #368B9C; --shade: #37565C;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0B1416; --surface: #132126; --fg: #E4EFF1; --muted: #98B0B6; --hair: #22363B;
  --tint: #16B9DB; --p1: #16B9DB; --shade: #8FB5BC; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 var(--font); }
a { color: var(--tint); }
a:focus-visible { outline: 2px solid var(--tint); outline-offset: 3px; border-radius: 4px; }
[hidden] { display: none !important; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; font-weight: 700; }
h2 { font-size: 21px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; overflow-wrap: anywhere; }
p { margin: 0; }
.kicker { font: 600 13px/1 var(--font); text-transform: uppercase; letter-spacing: 0.09em; color: var(--tint); }

nav { display: flex; align-items: center; justify-content: space-between; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 19px/1 var(--display); color: var(--fg); text-decoration: none; letter-spacing: -0.01em; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--p1); display: grid; place-items: center; }
nav .links { display: flex; gap: 22px; font-size: 15px; }
nav .links a { color: var(--muted); text-decoration: none; }
nav .links a:hover { color: var(--fg); }

main { max-width: 34rem; margin: 0 auto; padding-block: 24px 64px; }
#results { display: grid; gap: 24px; }
header { display: grid; gap: 12px; }
.lede { font-size: 18px; color: var(--muted); }

.spots { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.spot { background: var(--surface); border-radius: 20px; padding: 22px; display: grid; gap: 14px; min-width: 0; }
.spot-head { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
.rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--round); color: #fff; background: var(--shade); }
.spot:first-child .rank { background: var(--p1); }
@media (prefers-color-scheme: dark) { .rank { color: #0B1416; } }
.spot-head > div { display: grid; gap: 4px; min-width: 0; }
.address { color: var(--muted); font-size: 15.5px; overflow-wrap: anywhere; }
.times { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; border-top: 1px solid var(--hair); padding-top: 12px; }
.times li { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; }
.times li span { min-width: 0; overflow-wrap: anywhere; }
.times b { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.directions { justify-self: start; display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px; border-radius: 14px; background: color-mix(in srgb, var(--p1) 14%, transparent); color: var(--fg); font-weight: 600; text-decoration: none; }

.note { padding: 24px; border-radius: 20px; background: var(--surface); }
.note h1 { font-size: clamp(22px, 4.6vw, 28px); line-height: 1.25; }

footer { padding-block: 40px 56px; border-top: 1px solid var(--hair); display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; font-size: 15px; color: var(--muted); }
footer .links { display: flex; flex-wrap: wrap; gap: 20px; }
footer a { color: var(--muted); }

@media (max-width: 420px) {
  nav .links { gap: 16px; }
  .spot { padding: 18px; }
}
</style>
<link rel="icon" type="image/png" href="/logo.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head>
<body>
<div class="wrap">
  <nav aria-label="Main">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1.5c-3.3 0-6 2.5-6 5.8 0 4.2 6 9.2 6 9.2s6-5 6-9.2c0-3.3-2.7-5.8-6-5.8z" fill="#fff"/><path d="M5.8 7.6c1-.9 2-.9 3.2 0s2.2.9 3.2 0" fill="none" stroke="#368B9C" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      Compromise
    </a>
    <div class="links"><a href="/#how">How it works</a><a href="/privacy">Privacy</a></div>
  </nav>

  <main>
    <div id="results" hidden>
      <header>
        <p class="kicker">Shared from Compromise</p>
        <h1 id="title"></h1>
        <p class="lede">Travel times as they were when this was shared.</p>
      </header>
      <ol id="spots" class="spots"></ol>
    </div>

    <div id="refused" class="note" hidden>
      <h1>This link can't be read.</h1>
    </div>

    <noscript><div class="note"><h1>This page needs JavaScript to read the link.</h1></div></noscript>
  </main>

  <footer>
    <span>Compromise, by AlephB.</span>
    <div class="links"><a href="/privacy">Privacy policy</a></div>
  </footer>
</div>
<script src="/grouplink.js"></script>
<script>
(function () {
  "use strict";
  var agent = navigator.userAgent || "";
  var android = /Android/i.test(agent);
  var apple = !android && /iPhone|iPad|iPod|Macintosh/.test(agent);

  function directions(spot) {
    var at = spot.latitude + "," + spot.longitude;
    if (apple) return "https://maps.apple.com/?daddr=" + at;
    if (android) return "geo:" + at + "?q=" + at + "(" + encodeURIComponent(spot.name.replace(/[()]/g, "")) + ")";
    return "https://www.google.com/maps/dir/?api=1&destination=" + at;
  }

  function element(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function pagePath() {
    return location.pathname.replace(/index\.html$/, "").replace(/\.html$/, "").replace(/\/$/, "");
  }

  function render() {
    var link = GroupLink.read(location.hash);
    var ok = link && GroupLink.pathFor(link) === pagePath();
    document.getElementById("results").hidden = !ok;
    document.getElementById("refused").hidden = !!ok;
    if (!ok) return;

    var title = link.kind === "pick" ? "The spot" : link.spots.length === 1 ? "The top spot" : "The top " + link.spots.length + " spots";
    document.getElementById("title").textContent = title;
    document.title = title + " — Compromise";

    var list = document.getElementById("spots");
    list.textContent = "";
    link.spots.forEach(function (spot, index) {
      var item = element("li", "spot");
      var head = element("div", "spot-head");
      var rank = element("span", "rank", String(index + 1));
      rank.setAttribute("aria-hidden", "true");
      var text = element("div");
      text.appendChild(element("h2", null, spot.name));
      if (spot.address) text.appendChild(element("p", "address", spot.address));
      head.appendChild(rank);
      head.appendChild(text);
      item.appendChild(head);

      var times = element("ul", "times");
      times.setAttribute("aria-label", "Travel times");
      link.people.forEach(function (person, i) {
        var row = element("li");
        row.appendChild(element("span", null, person));
        row.appendChild(element("b", null, spot.minutes[i] + " min"));
        times.appendChild(row);
      });
      item.appendChild(times);

      var go = element("a", "directions", android ? "Open in Maps" : "Directions");
      go.href = directions(spot);
      go.setAttribute("aria-label", (android ? "Open " + spot.name + " in Maps" : "Directions to " + spot.name));
      if (!android) { go.target = "_blank"; go.rel = "noopener noreferrer"; }
      item.appendChild(go);
      list.appendChild(item);
    });
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
